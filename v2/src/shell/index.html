<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simman v2 — people</title>
    <style>
      :root { color-scheme: dark; font: 14px system-ui, sans-serif; }
      body { margin: 0; background: #101923; color: #e9eef2; }
      main { display: grid; grid-template-columns: minmax(0, 1fr) 260px; min-height: 100vh; }
      #map-wrap { display: grid; place-items: center; padding: 18px; }
      #map { width: min(100%, 1400px); height: auto; image-rendering: pixelated; border: 1px solid #385066; touch-action: none; }
      aside { padding: 18px; background: #172534; border-left: 1px solid #385066; }
      h1 { margin: 0 0 12px; font-size: 1.1rem; }
      label, select, button { display: block; width: 100%; margin: 8px 0; }
      input[type="range"] { width: 100%; }
      button { padding: 8px; color: inherit; background: #29435a; border: 1px solid #52708a; border-radius: 4px; }
      #status, #route { min-height: 2.4em; color: #b7c8d5; }
      #river-legend { color: #b7c8d5; font-size: .85rem; }
      .legend { display: flex; gap: 6px; flex-wrap: wrap; }
      .swatch { padding: 2px 5px; border-radius: 3px; color: #071018; }
    </style>
  </head>
  <body>
    <main>
      <div id="map-wrap"><canvas id="map" aria-label="Simman world map"></canvas></div>
      <aside>
        <h1>Simman observatory</h1>
        <label for="lens">Lens</label>
        <select id="lens">
          <option value="terrain">Terrain</option>
          <option value="climate">Climate</option>
          <option value="fertility">Fertility</option>
          <option value="crops">Crop suitability</option>
          <option value="population">Population density</option>
          <option value="technique">Farming technique</option>
          <option value="package">Crop package</option>
          <option value="can-grow">Can grow</option>
          <option value="native">Wild range</option>
          <option value="rivers">River passability</option>
          <option value="wind">Wind</option>
        </select>
        <label for="month">Month <span id="month-label">1</span></label>
        <input id="month" type="range" min="0" max="11" step="1" value="0" />
        <label for="zoom">Zoom <span id="zoom-label">1×</span></label>
        <input id="zoom" type="range" min="0" max="6" step=".01" value="0" />
        <button id="run" type="button">Pause</button>
        <label for="speed">Speed <span id="speed-label">1×</span></label>
        <input id="speed" type="range" min="0" max="6" step="1" value="0" />
        <div id="population">Population: waiting for worker…</div>
        <div id="status">Building immutable Earth substrate…</div>
        <div id="route">Click two land cells to query a travel route.</div>
        <div id="river-legend" hidden>
          <div class="legend">
            <span class="swatch" style="background:#46e15a">both ways</span>
            <span class="swatch" style="background:#f0aa28">downstream</span>
            <span class="swatch" style="background:#eb3c32">falls</span>
          </div>
        </div>
      </aside>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
